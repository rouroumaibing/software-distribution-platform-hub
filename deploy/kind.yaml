# kind 单节点集群（本地 dev 环境，见 docs/E2E-VERIFY-PLAN.md §1）。
# - 主机 8080 -> 节点 30080：hub NodePort 直连（curl / API 调试 / e2e 冒烟）。
# - 主机 8082 -> 节点 80  ：ingress-nginx http（controller hostPort 80，会 301 -> https）。
# - 主机 8443 -> 节点 443 ：ingress-nginx https（console 走 ClusterIP+ingress，
#   不再用 NodePort 直连；curl -k https://localhost:8443 + Host console.local 可达）。
# - containerd mirror：集群内引用 localhost:5000/<img> 的镜像自动回源到
#   跑在 kind docker 网络里的 kind-registry（主机 docker push localhost:5000/...）。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sdp-dev
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 80
        hostPort: 8082
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://kind-registry:5000"]
