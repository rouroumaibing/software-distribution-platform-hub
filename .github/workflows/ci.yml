name: ci

# L0 验证层 —— 纯检查、零产物、不触发发布（对齐 docs/ci-build-pipeline.md 的验证/发布分层理念）。
# 触发: push main + 任意 PR；文档/设计类改动不排队。
# 命令: go vet ./... -> go build ./... -> go test ./...（hub 有 3 个 *_test.go）。
# 双 checkout：hub 的 go.mod replace 指向 ../software-distribution-platform-runner（runner 尚未打 tag，
#   见 go.mod 内注释），CI 必须把 runner 源码放到 hub 上一级同名目录，replace 相对路径才解析。
#   演进：runner 打首个 tag 后 hub 改 require <tag> 即可删除 replace，届时本 workflow 去掉 runner checkout。

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: vet + build + test
    runs-on: ubuntu-latest
    steps:
      # runner 先 checkout 到 <workspace>/software-distribution-platform-runner
      - uses: actions/checkout@v4
        with:
          repository: rouroumaibing/software-distribution-platform-runner
          ref: main
          path: software-distribution-platform-runner

      # hub 自身 checkout 到 <workspace>/software-distribution-platform-hub
      # （replace ../software-distribution-platform-runner 恰好解析到上面的 runner）
      - uses: actions/checkout@v4
        with:
          path: software-distribution-platform-hub

      - uses: actions/setup-go@v5
        with:
          go-version-file: software-distribution-platform-hub/go.mod
          cache-dependency-path: |
            software-distribution-platform-hub/go.sum

      - name: Vet
        working-directory: software-distribution-platform-hub
        run: go vet ./...

      - name: Build
        working-directory: software-distribution-platform-hub
        run: go build ./...

      - name: Test
        working-directory: software-distribution-platform-hub
        run: go test ./...
