name: ci

# L0 验证层 —— 纯检查、零产物、不触发发布（对齐 docs/ci-build-pipeline.md 的验证/发布分层理念）。
# 触发: push main + 任意 PR；文档/设计类改动不排队。
# 命令: go vet ./... -> go build ./... -> go test ./...
# hub 自包含：go.mod 无 replace、不依赖 runner 源码（runner 类型经 internal/runnerproto 快照引入），
#   单 checkout 本仓即可；runner 在部署期以镜像形式被 hub 引用（deploy/manifests），不在 CI 编译期耦合。

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: vet + build + test
    runs-on: ubuntu-latest
    steps:
      # hub 自身 checkout 到 <workspace>/software-distribution-platform-hub（无需 runner 源码）
      - uses: actions/checkout@v4
        with:
          path: software-distribution-platform-hub

      - uses: actions/setup-go@v5
        with:
          go-version-file: software-distribution-platform-hub/go.mod
          cache-dependency-path: |
            software-distribution-platform-hub/go.sum

      - name: Vet
        working-directory: software-distribution-platform-hub
        run: go vet ./...

      - name: Build
        working-directory: software-distribution-platform-hub
        run: go build ./...

      - name: Test
        working-directory: software-distribution-platform-hub
        run: go test ./...
