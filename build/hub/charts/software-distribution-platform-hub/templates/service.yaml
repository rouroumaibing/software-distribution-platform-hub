apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.basic.component }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.basic.component }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.basic.component }}
  ports:
    - name: http
      port: {{ .Values.service.externPort }}
      targetPort: {{ .Values.service.containerPort }}
      nodePort: {{ .Values.service.nodePort }}
