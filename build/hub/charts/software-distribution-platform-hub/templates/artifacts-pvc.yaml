apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.basic.component }}-artifacts
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.artifact.storageClassName }}
  storageClassName: {{ .Values.artifact.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.artifact.storage }}
