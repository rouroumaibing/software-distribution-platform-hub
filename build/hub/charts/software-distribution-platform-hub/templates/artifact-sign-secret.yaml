{{- if not .Values.artifact.signSecretKeyRef.name }}
apiVersion: v1
kind: Secret
metadata:
  name: hub-artifact-sign
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: software-distribution-platform-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.artifact.signSecretKeyRef.key | default "signSecret" }}: {{ .Values.artifact.signSecret | default "" | quote }}
{{- end }}
