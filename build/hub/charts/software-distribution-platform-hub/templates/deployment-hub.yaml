apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.basic.component }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.basic.component }}
    version: v1
spec:
  replicas: {{ .Values.basic.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.basic.component }}
      version: v1
  template:
    metadata:
      annotations: {}
      labels:
        app: {{ .Values.basic.component }}
        version: v1
    spec:
      {{- if .Values.auth.resolveHostIp }}
      # dev-only 脚手架：hub 所在集群解析不了 issuer 的对外域名（如本地 kind 没有公司 DNS），
      # 把 <gatewayRoute.hostname> 指到给定 IP（本地 = kind 节点 IP，浏览器端口 :8443 经
      # extraPortMappings -> nodePort 30443 -> envoy）。生产用真 DNS，本值留空即不渲染。
      hostAliases:
        - ip: {{ .Values.auth.resolveHostIp | quote }}
          hostnames:
            - {{ .Values.gatewayRoute.hostname | quote }}
      {{- end }}
      containers:
        - name: container-1
          env:
            - name: HUB_ADDR
              value: ":{{ .Values.service.containerPort }}"
            - name: GATEWAY_PATH
              value: {{ .Values.gateway.path }}
            - name: GATEWAY_TOKEN
              value: {{ .Values.gateway.token }}
            # 鉴权（OIDC）：与 console chart 的 auth.* 同源（values.yaml 的 auth 段）。
            # ISSUER 为空 => hub 关闭鉴权（dev 模式，AuthDisabled() 为真）；打开须与 console 的 issuer 一致。
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.auth.keycloakIssuerUrl | default "" | trimSuffix "/" | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.auth.keycloakClientId | default "sdp-console" | quote }}
            {{- if and .Values.auth.keycloakIssuerUrl .Values.auth.adminClientSecret }}
            # hub 以 sdp-backend service account 调 Keycloak Admin API（org 载体组预置，
            # cmd/hub main()：secret 缺失只告警、跳过组同步）。取值须与 realm 预置里
            # sdp-backend 的 secret 字面量一致（keycloak-realm-configmap.yaml）。生产改 secretKeyRef。
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              value: {{ .Values.auth.adminClientSecret | quote }}
            {{- end }}
            {{- if .Values.auth.trustedCASecret }}
            # dev-only 脚手架：issuer 走自签证书（本地 gen-certs.sh 的 sdp-local-ca）时，
            # 挂 CA 并用 SSL_CERT_FILE 替换 Go 系统信任池（crypto/x509 在 Linux 上读该变量）。
            # 生产用公共 CA，留空即不渲染（也不影响 Go 默认池）。
            - name: SSL_CERT_FILE
              value: /etc/sdp-ca/ca.crt
            {{- end }}
            # 凭据加密（DATA-MODEL §9.7）：32 字节 AES-256 密钥；空 => 明文落库（dev）。
            # ⚠️ 用某密钥写过凭据后换密钥即无法解密——设定后不可换。生产用 secretKeyRef。
            - name: CREDENTIAL_ENCRYPTION_KEY
              value: {{ .Values.credentialEncryptionKey | default "" | quote }}
            - name: DB_DSN
              value: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.pwd }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.dbname }}?sslmode=disable"
            - name: LOG_LEVEL
              value: {{ .Values.log.level }}
            - name: ARTIFACT_STORE_DRIVER
              value: {{ .Values.artifact.driver }}
            - name: ARTIFACT_STORE_LOCAL_ROOT
              value: {{ .Values.artifact.localRoot }}
            - name: ARTIFACT_STORE_PUBLIC_URL
              value: {{ .Values.artifact.publicUrl }}
            # G-1（2026-09-26）：注入执行 Job 的 ServiceAccount 名，runner 会在
            # 运行命名空间幂等 ensure 该 SA + 最小部署 Role/RoleBinding。
            # 置空回退旧行为（Job 用 ns default SA，无部署权限）。
            - name: SDP_JOB_SERVICE_ACCOUNT
              value: {{ .Values.jobServiceAccount | default "sdp-deploy" }}
            # 版本矩阵（CM package-versions，模板 configmap-package-versions.yaml）：
            # 供接入管理展示与 runner 安装/升级取值
            - name: PACKAGE_VERSION_CONSOLE
              valueFrom:
                configMapKeyRef:
                  name: package-versions
                  key: console
            - name: PACKAGE_VERSION_HUB
              valueFrom:
                configMapKeyRef:
                  name: package-versions
                  key: hub
            - name: PACKAGE_VERSION_RUNNER
              valueFrom:
                configMapKeyRef:
                  name: package-versions
                  key: runner
          image: {{ .Values.image.imageAddr }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.resources.resources_cpu_requests }}
              memory: {{ .Values.resources.resources_mem_requests }}
            limits:
              cpu: {{ .Values.resources.resources_cpu_limits }}
              memory: {{ .Values.resources.resources_mem_limits }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.artifact.localRoot }}
            {{- if .Values.auth.trustedCASecret }}
            - name: sdp-ca
              mountPath: /etc/sdp-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.basic.component }}-artifacts
        {{- if .Values.auth.trustedCASecret }}
        - name: sdp-ca
          secret:
            secretName: {{ .Values.auth.trustedCASecret }}
            items:
              # gen-certs.sh 约定：console-tls 含 ca.crt / server.crt / server.key
              - key: ca.crt
                path: ca.crt
        {{- end }}
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  progressDeadlineSeconds: 600
