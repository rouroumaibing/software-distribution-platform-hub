basePath: /api/v1
definitions:
  github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope:
    properties:
      data: {}
      error:
        type: string
      errorCode:
        type: string
      reasons:
        items:
          type: string
        type: array
    type: object
  github_com_rouroumaibing_software-distribution-platform-hub_internal_environment_service.ExecRequest:
    properties:
      command:
        type: string
      script:
        type: string
    type: object
  github_com_rouroumaibing_software-distribution-platform-hub_internal_run_models.TriggerRequest:
    properties:
      commitSha:
        description: CommitSHA records the resolved commit for audit display.
        type: string
      params:
        description: Params are substituted into task command/args/env by the runner.
        items:
          $ref: '#/definitions/v1alpha1.Param'
        type: array
      repoPath:
        type: string
      repoRef:
        type: string
      repoUrl:
        description: |-
          RepoURL/RepoRef/RepoPath describe the source checkout for script tasks.
          The hub resolves Ref to a concrete commit SHA at trigger time.
        type: string
      targetId:
        description: |-
          TargetID overrides target selection. If nil/empty, the hub picks the
          first online target. Ignored when TargetIDs is set.
        type: string
      targetIds:
        description: |-
          TargetIDs fans the trigger out to multiple environments: one independent
          PipelineRun is created per listed target (each keeps the 1:1 run↔target
          invariant). Targets only need to EXIST, not be online — the durable
          dispatch queue delivers each run once its Runner reconnects.
          When set, TargetID is ignored.
        items:
          type: string
        type: array
      targetNamespace:
        description: |-
          TargetNamespace is the K8s namespace the runner creates Jobs in.
          Defaults to "sdp-run" when empty.
        type: string
      triggeredBy:
        description: TriggeredBy is the hub-side user/system identity starting the
          run.
        type: string
    type: object
  internal_run_handler.ApprovalDecisionRequest:
    properties:
      approved:
        description: Approved is true to sign off, false to reject.
        type: boolean
      approver:
        description: |-
          Approver optionally overrides the identity recorded on the Runner;
          defaults to the authenticated user (or the dev user in dev mode).
        type: string
      reason:
        description: Reason is free text for the audit trail (stored by the Runner).
        type: string
    type: object
  internal_run_handler.RolloutControlRequest:
    properties:
      action:
        description: Action is one of pause | promote | rollback.
        type: string
      operator:
        description: |-
          Operator optionally overrides the identity recorded on the Runner;
          defaults to the authenticated user (or the dev user in dev mode).
        type: string
    type: object
  v1alpha1.Param:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Platform Team
  description: 'Control plane API for the K8s software distribution platform: orgs,
    catalogs, components, pipelines, runs, targets and permissions, plus a Runner
    WebSocket gateway.'
  termsOfService: http://swagger.io/terms/
  title: Software Distribution Platform Hub API
  version: "1.0"
paths:
  /agent-ops/{id}:
    get:
      description: Returns the ledger row (id, opType, status, detail, message) —
        the polling fallback for environments where SSE is impractical.
      parameters:
      - description: Agent op ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Get one agent op
      tags:
      - agent-ops
  /agent-ops/{id}/stream:
    get:
      description: Replays persisted log chunks, then pushes live status/log events;
        closes after a terminal status (succeeded|failed).
      parameters:
      - description: Agent op ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Stream one agent op's output and status (SSE)
      tags:
      - agent-ops
  /environments/{id}/exec:
    post:
      consumes:
      - application/json
      description: Validates the request and records an agent_ops entry (queued);
        execution is performed by the Runner / direct-connect executor, not the hub
        (no client-go).
      parameters:
      - description: Environment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: command or script (at least one)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_environment_service.ExecRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Queue a direct-exec operation on the environment's target
      tags:
      - environments
  /pipelines/{id}/versions:
    get:
      description: 'Returns the append-only snapshot history (newest first): version
        number, author, stage/task counts, and whether the body differs from the previous
        version. Bodies are omitted — fetch one with GET /pipelines/:id/versions/:version.'
      parameters:
      - description: Pipeline ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: max versions to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: List a pipeline's definition versions
      tags:
      - pipelines
  /pipelines/{id}/versions/{version}:
    get:
      parameters:
      - description: Pipeline ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Version number
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Get one pipeline definition version (full snapshot body)
      tags:
      - pipelines
  /pipelines/{id}/versions/{version}/diff:
    get:
      description: 'Returns the stage/task level differences from ?against=<n> to
        :version. Directional: added/removed swap if :version is the older one.'
      parameters:
      - description: Pipeline ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Target version number
        in: path
        name: version
        required: true
        type: integer
      - description: Baseline version number
        in: query
        name: against
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Diff two versions of a pipeline definition
      tags:
      - pipelines
  /pipelines/{id}/versions/{version}/rollback:
    post:
      description: 'Re-materializes the version''s stages and task templates and records
        the result as a new version. Structure only — pipeline metadata (name/kind/description)
        is left alone. History is append-only: no version rows are rewritten or deleted.'
      parameters:
      - description: Pipeline ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Version number to restore
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Roll a pipeline's structure back to a past version
      tags:
      - pipelines
  /pipelines/{pipelineId}/runs:
    get:
      parameters:
      - description: Pipeline ID (UUID)
        in: path
        name: pipelineId
        required: true
        type: string
      - description: page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: List pipeline runs for a pipeline
      tags:
      - runs
    post:
      consumes:
      - application/json
      description: Assembles a PipelineRunSpec from the pipeline's current stages/tasks
        and dispatches it to a target Runner. Set targetIds to fan the same trigger
        out to multiple environments (one independent run per target); ignored when
        targetId is set.
      parameters:
      - description: Pipeline ID (UUID)
        in: path
        name: pipelineId
        required: true
        type: string
      - description: Trigger request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_run_models.TriggerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Trigger a pipeline run
      tags:
      - runs
  /pipelines/{pipelineId}/runs/{runId}/tasks/{taskName}/decision:
    post:
      consumes:
      - application/json
      description: Relays an approver's decision to the Runner via the gateway. Approver
        defaults to the current user.
      parameters:
      - description: Pipeline ID (UUID)
        in: path
        name: pipelineId
        required: true
        type: string
      - description: Pipeline Run ID (UUID)
        in: path
        name: runId
        required: true
        type: string
      - description: Task name awaiting approval
        in: path
        name: taskName
        required: true
        type: string
      - description: Approval decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_run_handler.ApprovalDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Submit an approval decision for a paused Approval task
      tags:
      - runs
  /runs:
    get:
      parameters:
      - description: filter by phase, e.g. Failed / Running / Succeeded
        in: query
        name: phase
        type: string
      - description: page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: List pipeline runs across all pipelines (Run Center)
      tags:
      - runs
  /runs/{id}:
    get:
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Get a pipeline run by ID
      tags:
      - runs
  /runs/{id}/cancel:
    post:
      description: 'Asks the Runner owning the run to stop it: mark the PipelineRun
        Cancelled and tear down its in-flight TaskRuns. Only a Pending / Running /
        WaitingApproval run can be cancelled; a finished run returns 409. The new
        phase is recorded when the Runner streams its status update back.'
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Cancel a running pipeline run
      tags:
      - runs
  /runs/{id}/progress:
    get:
      description: Lightweight status endpoint for high-frequency console polling;
        returns the run phase and per-task status rows, not the full pipeline definition.
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Get a pipeline run's live progress (phase + per-task status)
      tags:
      - runs
  /runs/{id}/redispatch:
    post:
      description: Re-enqueues a fresh dispatch job carrying the last payload for
        a run whose delivery is stuck (failed/dead) or unconfirmed. Succeeds even
        if the Runner is offline; the job is delivered on reconnect or by the sweeper.
        A run stuck in Failed is reset to Pending.
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Re-deliver a pipeline run's spec to its target
      tags:
      - runs
  /runs/{id}/stage-progress:
    get:
      description: Aggregated stage rows (name/sequence/executionMode/status/done/total)
        derived on read from the run's TaskRuns; feeds console §7.6 stage cards.
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Per-stage progress of a pipeline run
      tags:
      - runs
  /runs/{id}/tasks:
    get:
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: List tasks of a pipeline run
      tags:
      - runs
  /runs/{id}/tasks/{name}/log:
    get:
      description: Returns the ordered log chunks the hub persisted as a Runner streamed
        them over MessageLogChunk. Use the :name path param for a specific DAG task,
        or the /runs/:id/log variant for run-level output. Chunks are served in emission
        order.
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Task name; the run-level log uses the bucket __run__
        in: path
        name: name
        required: true
        type: string
      - description: page (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Get a task's (or run-level) streamed logs for a pipeline run
      tags:
      - runs
  /runs/{id}/tasks/{name}/rerun:
    post:
      description: Asks the Runner owning the run to reset one task (and, on the Runner,
        every downstream task that depends on it) so the DAG picks it up again — without
        re-dispatching the whole run.
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Task name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Re-run a single task of a pipeline run
      tags:
      - runs
  /runs/{id}/tasks/{name}/rollout:
    post:
      consumes:
      - application/json
      description: Relays the operator command to the Runner via the gateway; the
        resulting phase change streams back via status updates.
      parameters:
      - description: Pipeline Run ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Release task name
        in: path
        name: name
        required: true
        type: string
      - description: Rollout control command
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_run_handler.RolloutControlRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: Send a pause/promote/rollback command to a Release task's Rollout
      tags:
      - runs
  /targets/{id}/agent-ops:
    get:
      description: Paged ledger listing (newest first) — the console's per-target
        operation history.
      parameters:
      - description: Target ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rouroumaibing_software-distribution-platform-hub_internal_common.Envelope'
      summary: List agent ops of a target
      tags:
      - agent-ops
  /targets/{id}/install:
    post:
      description: Records an agent_ops entry (queued) carrying the runner version
        from the package-versions matrix; execution is the Runner's job (§9.9).
